function BreakdownEditor({breakdown,setBreakdown,jobTypes}){
  function addRow(){setBreakdown(prev=>[...prev,{id:Date.now(),type:jobTypes[0]?.name||"",qty:1,unitPrice:jobTypes[0]?.defaultPrice||0,note:""}]);}
  function upRow(id,field,val){setBreakdown(prev=>prev.map(r=>r.id===id?{...r,[field]:val}:r));}
  function rmRow(id){setBreakdown(prev=>prev.filter(r=>r.id!==id));}
  function moveRow(id,dir){setBreakdown(prev=>{const idx=prev.findIndex(r=>r.id===id);if(idx<0)return prev;const next=[...prev];const swap=idx+dir;if(swap<0||swap>=next.length)return prev;[next[idx],next[swap]]=[next[swap],next[idx]];return next;});}
  const total=bdTotal(breakdown);
  return(<div><div style={{display:"grid",gridTemplateColumns:"28px 1fr 56px 96px 72px 1fr 28px",gap:4,marginBottom:4,alignItems:"center"}}><div/><div style={{fontSize:11,fontWeight:600,color:"#94A3B8"}}>種別</div><div style={{fontSize:11,fontWeight:600,color:"#94A3B8",textAlign:"center"}}>数量</div><div style={{fontSize:11,fontWeight:600,color:"#94A3B8",textAlign:"right"}}>単価</div><div style={{fontSize:11,fontWeight:600,color:"#94A3B8",textAlign:"right"}}>小計</div><div style={{fontSize:11,fontWeight:600,color:"#94A3B8"}}>メモ</div><div/></div>{breakdown.map((r,idx)=>{const sub=Number(r.qty||0)*Number(r.unitPrice||0);return(<div key={r.id} style={{display:"grid",gridTemplateColumns:"28px 1fr 56px 96px 72px 1fr 28px",gap:4,marginBottom:5,alignItems:"center"}}><div style={{display:"flex",flexDirection:"column",gap:1}}><button onClick={()=>moveRow(r.id,-1)} disabled={idx===0} style={{padding:"1px 3px",fontSize:9,lineHeight:1,border:"1px solid #E2E8F0",borderRadius:3,minHeight:0}}>▲</button><button onClick={()=>moveRow(r.id,1)} disabled={idx===breakdown.length-1} style={{padding:"1px 3px",fontSize:9,lineHeight:1,border:"1px solid #E2E8F0",borderRadius:3,minHeight:0}}>▼</button></div><select value={r.type} onChange={e=>upRow(r.id,"type",e.target.value)} style={{fontSize:12,padding:"5px 6px"}}>{jobTypes.map(t=><option key={t.id} value={t.name}>{t.name}</option>)}<option value="その他">その他</option></select><input type="number" value={r.qty} min={1} onChange={e=>upRow(r.id,"qty",e.target.value)} style={{fontSize:12,padding:"5px 6px",textAlign:"center"}}/><input type="number" value={r.unitPrice} onChange={e=>upRow(r.id,"unitPrice",e.target.value)} style={{fontSize:12,padding:"5px 6px",textAlign:"right"}}/><div style={{fontSize:12,fontWeight:600,color:"#1E293B",textAlign:"right",padding:"0 2px"}}>{yen(sub)}</div><input placeholder="メモ" value={r.note||""} onChange={e=>upRow(r.id,"note",e.target.value)} style={{fontSize:12,padding:"5px 6px"}}/><button onClick={()=>rmRow(r.id)} style={{padding:"3px",color:"#EF4444",border:"1px solid #FECDD3",background:"#FFF1F2",borderRadius:6,fontSize:12,fontWeight:700}}>×</button></div>);})}
  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}><button onClick={addRow} style={{fontSize:12,padding:"3px 10px",color:"var(--clr-primary)",borderColor:"var(--clr-primary)",background:"transparent"}}>+ 行を追加</button><div style={{fontSize:13,fontWeight:700,color:"#1E293B"}}>内訳合計: {yen(total)}</div></div></div>);
}

function HomeTab({jobs,clients,settings,expenses}){
  const gc=id=>clients.find(c=>c.id===id);
  const ty=thisYear(),tm=thisMonth(),now=new Date();
  const remMonths=12-now.getMonth();
  const yearJobs=jobs.filter(j=>j.receiveDate?.startsWith(ty));
  const paidY=yearJobs.filter(j=>j.status==="入金済").reduce((s,j)=>s+totalPrice(j),0);
  const unpaidY=yearJobs.filter(j=>["受付","制作中","修正中","納品済"].includes(j.status)).reduce((s,j)=>s+totalPrice(j),0);
  const monthJobs=jobs.filter(j=>j.receiveDate?.startsWith(tm));
  const incM=monthJobs.filter(j=>["納品済","入金済"].includes(j.status)).reduce((s,j)=>s+totalPrice(j),0);
  const inProg=jobs.filter(j=>["受付","制作中","修正中"].includes(j.status));
  const jobsM=monthJobs.length;
  const monthlyExp=expenses.filter(e=>e.type==="monthly"&&e.level<=2).reduce((s,e)=>s+Number(e.amount),0);
  const monthsPassed=now.getMonth()+1;
  const avgMonthlyInc=monthsPassed>0?(paidY+unpaidY)/monthsPassed:0;
  const yearEndEst=avgMonthlyInc*12;
  const yearExpEst=monthlyExp*12;
  const urgent=inProg.filter(j=>daysUntil(j.deadline)<=3);
  const hrAlerts=inProg.filter(j=>j.actualHours>0&&hrRate(totalPrice(j),j.actualHours)<settings.alertHourlyRate);
  const actions=[];
  jobs.filter(j=>!j.contracted&&["受付","制作中"].includes(j.status)).forEach(j=>actions.push({type:"warn",icon:"ti-writing",text:`「${j.title||"案件"}」の受注書がまだです`}));
  jobs.filter(j=>j.status==="納品済"&&!j.invoiced).forEach(j=>actions.push({type:"danger",icon:"ti-file-invoice",text:`「${j.title||"案件"}」の請求書を発行してください`}));
  jobs.filter(j=>j.invoiced&&j.status==="納品済").forEach(j=>actions.push({type:"info",icon:"ti-coin",text:`「${j.title||"案件"}」の入金を確認してください`}));
  urgent.forEach(j=>actions.push({type:"danger",icon:"ti-bell",text:`「${j.title||"案件"}」締切まであと${daysUntil(j.deadline)}日！`}));
  hrAlerts.forEach(j=>actions.push({type:"warn",icon:"ti-alert-triangle",text:`「${j.title||"案件"}」の時給が目標を下回っています（${yen(hrRate(totalPrice(j),j.actualHours))}/h）`}));
  const aC={danger:"#FFF1F2",warn:"#FFF7ED",info:"#EFF6FF"};
  const aB={danger:"#FECDD3",warn:"#FED7AA",info:"#BFDBFE"};
  const aT={danger:"#BE123C",warn:"#C2410C",info:"#1D4ED8"};
  return(<div>
    <h2 style={{fontSize:18,fontWeight:700,color:"#1E293B",marginBottom:"1rem"}}>ダッシュボード</h2>
    {actions.length>0&&<Card style={{marginBottom:"1rem"}}><div style={{fontSize:13,fontWeight:700,color:"#1E293B",marginBottom:8,display:"flex",alignItems:"center",gap:6}}><i className="ti ti-player-play" style={{color:"var(--clr-primary)"}}/>次にやること</div><div style={{display:"flex",flexDirection:"column",gap:6}}>{actions.slice(0,5).map((a,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:aC[a.type],border:`1px solid ${aB[a.type]}`,borderRadius:8}}><i className={`ti ${a.icon}`} style={{fontSize:15,color:aT[a.type],flexShrink:0}}/><span style={{fontSize:12,color:aT[a.type],flex:1}}>{a.text}</span></div>))}</div></Card>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10,marginBottom:"1rem"}}>
      <MetricCard label="今月受注数" value={`${jobsM}件`} sub={`上限まで${settings.monthlyJobLimit-jobsM}件`} warn={jobsM>=settings.monthlyJobLimit}/>
      <MetricCard label="今月収益" value={yen(incM)}/>
      <MetricCard label="今月経費" value={yen(monthlyExp)} sub="毎月固定（Lv1-2）"/>
      <MetricCard label="今月手取り" value={yen(incM-monthlyExp)} color={incM-monthlyExp<0?"#EF4444":undefined}/>
    </div>
    <Card style={{marginBottom:"1rem"}}>
      <div style={{fontSize:13,fontWeight:700,color:"#1E293B",marginBottom:12,display:"flex",alignItems:"center",gap:6}}><i className="ti ti-calendar-stats" style={{color:"var(--clr-primary)"}}/>年間収益の見通し（{ty}年）</div>
      <DualProgressBar paidAmount={paidY} unpaidAmount={unpaidY} max={settings.incomeLimit} label={`収益上限 (${settings.incomeLimitType}) ${yen(settings.incomeLimit)}`}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:12}}>
        <div style={{background:"var(--clr-bg)",borderRadius:8,padding:"8px 12px",border:"1px solid #E2E8F0"}}><div style={{fontSize:11,color:"#64748B",marginBottom:3}}>年末経費推定</div><div style={{fontSize:15,fontWeight:700,color:"#EF4444"}}>{yen(yearExpEst)}</div><div style={{fontSize:11,color:"#94A3B8",marginTop:2}}>月{yen(monthlyExp)}×12ヶ月</div></div>
        <div style={{background:"var(--clr-bg)",borderRadius:8,padding:"8px 12px",border:"1px solid #E2E8F0"}}><div style={{fontSize:11,color:"#64748B",marginBottom:3}}>このペースでの年末収益予測</div><div style={{fontSize:15,fontWeight:700,color:yearEndEst>settings.incomeLimit?"#EF4444":"#10B981"}}>{yen(yearEndEst)}</div><div style={{fontSize:11,color:"#94A3B8",marginTop:2}}>月平均{yen(Math.round(avgMonthlyInc))}×12</div></div>
      </div>
      {yearEndEst>settings.incomeLimit&&<div style={{marginTop:10,background:"#FFF1F2",border:"1px solid #FECDD3",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#BE123C"}}>⚠ このペースだと年収上限（{yen(settings.incomeLimit)}）を超える可能性があります。残り{remMonths}ヶ月の受注可能目安: {yen(Math.max(0,settings.incomeLimit-paidY-unpaidY))}</div>}
    </Card>
    <Card><div style={{fontSize:13,fontWeight:700,color:"#1E293B",marginBottom:10,display:"flex",alignItems:"center",gap:6}}><i className="ti ti-loader" style={{color:"var(--clr-primary)"}}/>進行中の案件</div>
    {inProg.length===0?<div style={{color:"#64748B",fontSize:13}}>進行中の案件はありません</div>:<div style={{display:"flex",flexDirection:"column",gap:6}}>{inProg.map(j=>{const cl=gc(j.clientId),tp=totalPrice(j),rate=j.actualHours>0?hrRate(tp,j.actualHours):null,rw=rate!==null&&rate<settings.alertHourlyRate,ckDone=(j.checklist||[]).filter(c=>c.done).length,ckTotal=(j.checklist||[]).length;return(<div key={j.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"var(--clr-bg)",borderRadius:8,border:`1.5px solid ${rw?"#FED7AA":"#E2E8F0"}`,flexWrap:"wrap"}}><div style={{width:8,height:8,borderRadius:"50%",background:cl?.color||"#ccc",flexShrink:0}}/><Badge status={j.status}/><div style={{flex:1,minWidth:80}}><div style={{fontSize:13,fontWeight:600}}>{j.title||"（案件名なし）"}</div><div style={{fontSize:11,color:"#64748B"}}>{cl?.name} · ✓{ckDone}/{ckTotal}</div></div><span style={{fontSize:12,fontWeight:600}}>{yen(tp)}</span>{rate!==null&&<span style={{fontSize:11,color:rw?"#C2410C":"#64748B"}}>{yen(rate)}/h</span>}<span style={{fontSize:12,color:daysUntil(j.deadline)<=3?"#EF4444":"#64748B"}}>締切{j.deadline}({daysUntil(j.deadline)}日後)</span></div>);})}</div>}
    </Card>
  </div>);
}

function JobsTab({jobs,setJobs,clients,setClients,settings}){
  const[modal,setModal]=useState(false);const[editJob,setEditJob]=useState(null);const[filterS,setFilterS]=useState("すべて");const[compact,setCompact]=useState(false);const[confirmDel,setConfirmDel]=useState(null);

  const filtered=filterS==="すべて"?jobs:jobs.filter(j=>j.status===filterS);

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem",flexWrap:"wrap",gap:8}}><h2 style={{fontSize:18,fontWeight:700,color:"#1E293B"}}>案件管理</h2><div style={{display:"flex",gap:8}}><button onClick={()=>setCompact(c=>!c)} style={{fontSize:12,padding:"4px 10px"}}>{compact?"詳細":"コンパクト"}</button><button onClick={()=>{setEditJob(null);setModal(true);}} style={{background:"var(--clr-primary)",color:"#fff",border:"none",borderRadius:8,padding:"6px 16px",fontWeight:700,cursor:"pointer",fontSize:13}}><i className="ti ti-plus"/> 新規案件</button></div></div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:"1rem"}}>{["すべて",...STATUS_LIST].map(s=><button key={s} onClick={()=>setFilterS(s)} style={{fontSize:12,padding:"4px 12px",fontWeight:filterS===s?700:400,background:filterS===s?"var(--clr-primary)":"transparent",color:filterS===s?"#fff":"#64748B",border:`1.5px solid ${filterS===s?"var(--clr-primary)":"#E2E8F0"}`,borderRadius:20}}>{s}</button>)}</div>
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {filtered.length===0&&<div style={{color:"#64748B",fontSize:13,padding:"1rem"}}>案件がありません</div>}
      {filtered.map(j=>{const cl=gc(j.clientId),tp=totalPrice(j),rate=j.actualHours>0?hrRate(tp,j.actualHours):j.estimatedHours>0?hrRate(tp,j.estimatedHours):null,rw=rate!==null&&rate<settings.alertHourlyRate,ck=(j.checklist||[]).filter(c=>c.done).length,ckT=(j.checklist||[]).length,types=[...new Set((j.breakdown||[]).map(r=>r.type))].join("・");return(<Card key={j.id} style={{padding:"0.875rem 1rem"}} accent={rw?"#FED7AA":undefined}><div style={{display:"flex",alignItems:"flex-start",gap:8,flexWrap:"wrap"}}><div style={{width:10,height:10,borderRadius:"50%",background:cl?.color||"#ccc",flexShrink:0,marginTop:4}}/><Badge status={j.status}/><div style={{flex:1,minWidth:100}}><div style={{fontWeight:700,fontSize:14,color:"#1E293B"}}>{j.title||"（案件名なし）"}</div><div style={{fontSize:12,color:"#64748B",marginTop:2}}>{cl?.name}{types?` · ${types}`:""}</div></div><div style={{textAlign:"right"}}><div style={{fontWeight:700,fontSize:14}}>{yen(tp)}</div>{rate!==null&&<div style={{fontSize:11,color:rw?"#C2410C":"#64748B"}}>{yen(rate)}/h{rw?" ⚠":""}</div>}</div>{!compact&&<div style={{fontSize:12,color:"#64748B",textAlign:"right"}}><div>締切:{j.deadline}</div><div style={{marginTop:2}}>✓ {ck}/{ckT}</div></div>}<div style={{display:"flex",gap:4}}><button onClick={()=>{setEditJob(j);setModal(true);}} style={{padding:"3px 8px",fontSize:13,borderRadius:6}}><i className="ti ti-edit"/></button><button onClick={()=>setConfirmDel(j.id)} style={{padding:"3px 8px",fontSize:13,borderRadius:6,color:"#fff",background:"#EF4444",border:"1px solid #EF4444"}}><i className="ti ti-trash"/></button></div></div>{!compact&&(j.breakdown||[]).length>0&&<div style={{marginTop:8,paddingTop:8,borderTop:"1px solid #E2E8F0",display:"flex",gap:6,flexWrap:"wrap"}}>{j.breakdown.map(r=><span key={r.id} style={{fontSize:11,background:"var(--clr-bg)",border:"1px solid #E2E8F0",borderRadius:6,padding:"2px 8px",color:"#64748B"}}>{r.type} ×{r.qty} {yen(r.qty*r.unitPrice)}</span>)}{(j.addOns||[]).length>0&&j.addOns.map(a=><span key={a.id} style={{fontSize:11,background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:6,padding:"2px 8px",color:"#C2410C"}}>追加: {yen(a.amount)}</span>)}</div>}{!compact&&j.notes&&<div style={{fontSize:12,color:"#64748B",marginTop:6}}>{j.notes}</div>}</Card>);})}
    </div>

  </div>);

function CalendarTab({jobs,clients,settings}){
  const[yr,setYr]=useState(new Date().getFullYear());const[mo,setMo]=useState(new Date().getMonth());const[vt,setVt]=useState(settings.calendarView);const[dt,setDt]=useState(settings.calendarDateType);
  const gc=id=>clients.find(c=>c.id===id);
  const first=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate();
  const cells=[...Array(first).fill(null),...Array.from({length:dim},(_,i)=>i+1)];
  const ds=d=>`${yr}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const todStr=toDay();
  function inRange(j,d){const date=ds(d),start=j.startDate||j.receiveDate,end=dt==="targetDate"?(j.targetDate||j.deadline):j.deadline;return date>=start&&date<=end;}
  return(<div>

    <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:10}}>{clients.map(c=><div key={c.id} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,color:"#64748B"}}><div style={{width:9,height:9,borderRadius:"50%",background:c.color}}/>{c.name}</div>)}</div>
    <Card style={{padding:"0.75rem"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1,marginBottom:4}}>{["日","月","火","水","木","金","土"].map((d,i)=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:i===0?"#EF4444":i===6?"#60A5FA":"#64748B",padding:"4px 0"}}>{d}</div>)}</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>{cells.map((d,i)=>{if(!d)return<div key={i}/>;const dateStr=ds(d),isToday=dateStr===todStr,rj=vt==="bar"?jobs.filter(j=>inRange(j,d)):[],dj=vt==="dot"?jobs.filter(j=>{if(dt==="deadline")return j.deadline===dateStr;if(dt==="targetDate")return j.targetDate===dateStr;return j.startDate===dateStr;}):[];const isSun=(first+d-1)%7===0,isSat=(first+d-1)%7===6;return(<div key={i} style={{minHeight:60,padding:"3px 4px",borderRadius:6,background:isToday?"rgba(99,102,241,0.1)":"transparent",border:`1px solid ${isToday?"var(--clr-primary)":"#E2E8F0"}`}}><div style={{fontSize:12,fontWeight:isToday?700:400,color:isToday?"var(--clr-primary)":isSun?"#EF4444":isSat?"#60A5FA":"#1E293B",marginBottom:2}}>{d}</div>{vt==="dot"?<div style={{display:"flex",flexWrap:"wrap",gap:2}}>{dj.map(j=><div key={j.id} title={`${gc(j.clientId)?.name} ${j.title||""}`} style={{width:7,height:7,borderRadius:"50%",background:gc(j.clientId)?.color||"#888"}}/>)}</div>:rj.map(j=><div key={j.id} title={`${gc(j.clientId)?.name} ${j.title||""}`} style={{fontSize:10,background:gc(j.clientId)?.color||"#888",color:"#fff",borderRadius:3,padding:"1px 3px",marginBottom:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{j.title||gc(j.clientId)?.name||""}</div>)}</div>);})}</div>
    </Card>
  </div>);
}

      <DualProgressBar paidAmount={paidY} unpaidAmount={unpaidY} max={settings.incomeLimit} label={`年収益上限 (${settings.incomeLimitType}) ${yen(settings.incomeLimit)}`}/>
    </Card>
    <Card>

function AnalysisTab({jobs,clients,expenses,settings}){
  const now=new Date(),y=now.getFullYear(),m=now.getMonth();
  const PRESETS=[{label:"今月",start:`${y}-${String(m+1).padStart(2,"0")}-01`,end:toDay()},{label:"先月",start:new Date(y,m-1,1).toISOString().slice(0,10),end:new Date(y,m,0).toISOString().slice(0,10)},{label:"今四半期",start:new Date(y,Math.floor(m/3)*3,1).toISOString().slice(0,10),end:toDay()},{label:"今年",start:`${y}-01-01`,end:`${y}-12-31`},{label:"去年",start:`${y-1}-01-01`,end:`${y-1}-12-31`},{label:"全期間",start:"2000-01-01",end:"2099-12-31"}];
  const[preset,setPreset]=useState("今年");const[customStart,setCustomStart]=useState(`${y}-01-01`);const[customEnd,setCustomEnd]=useState(toDay());const[isCustom,setIsCustom]=useState(false);
  const start=isCustom?customStart:(PRESETS.find(p=>p.label===preset)?.start||`${y}-01-01`);
  const end=isCustom?customEnd:(PRESETS.find(p=>p.label===preset)?.end||toDay());
  const gc=id=>clients.find(c=>c.id===id);
  const filtered=useMemo(()=>jobs.filter(j=>j.receiveDate>=start&&j.receiveDate<=end),[jobs,start,end]);
  const paid=filtered.filter(j=>["納品済","入金済"].includes(j.status));
  const totalInc=paid.reduce((s,j)=>s+totalPrice(j),0);
  const unpaidInc=filtered.filter(j=>["受付","制作中","修正中"].includes(j.status)).reduce((s,j)=>s+totalPrice(j),0);
  const months=Math.max(1,Math.ceil((new Date(end)-new Date(start))/(1000*60*60*24*30)));
  const monthlyExpTotal=expenses.filter(e=>e.type==="monthly").reduce((s,e)=>s+Number(e.amount),0);
  const periodExp=monthlyExpTotal*months;
  const netInc=totalInc-periodExp;
  const monthDiff=Math.max(1,(new Date(end).getFullYear()-new Date(start).getFullYear())*12+(new Date(end).getMonth()-new Date(start).getMonth())||1);
  const avgMonthlyInc=totalInc/monthDiff;const avgMonthlyJobs=filtered.length/monthDiff;
  const typeStats=useMemo(()=>{const m={};filtered.forEach(j=>(j.breakdown||[]).forEach(r=>{if(!m[r.type])m[r.type]={type:r.type,qty:0,total:0};m[r.type].qty+=Number(r.qty||0);m[r.type].total+=Number(r.qty||0)*Number(r.unitPrice||0);}));return Object.values(m).sort((a,b)=>b.total-a.total);},[filtered]);
  const cStats=useMemo(()=>{const m={};filtered.forEach(j=>{const cl=gc(j.clientId),k=j.clientId;if(!m[k])m[k]={name:cl?.name||"不明",color:cl?.color,count:0,total:0};m[k].count++;m[k].total+=totalPrice(j);});return Object.values(m).sort((a,b)=>b.total-a.total);},[filtered,clients]);
  const ty=String(y);
  const yearIncome=jobs.filter(j=>j.receiveDate?.startsWith(ty)&&["納品済","入金済"].includes(j.status)).reduce((s,j)=>s+totalPrice(j),0);
  const uninvoiced=jobs.filter(j=>j.status==="納品済"&&!j.invoiced);
  const waitingPayment=jobs.filter(j=>j.invoiced&&j.status==="納品済");
  const lowRate=jobs.filter(j=>j.actualHours>0&&hrRate(totalPrice(j),j.actualHours)<settings.alertHourlyRate&&["受付","制作中","修正中"].includes(j.status));
  return(<div>
    <h2 style={{fontSize:18,fontWeight:700,color:"#1E293B",marginBottom:"1rem"}}>分析・レポート</h2>
    <Card style={{marginBottom:"1rem"}}>
      <div style={{fontSize:13,fontWeight:700,color:"#1E293B",marginBottom:10}}>集計期間</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:isCustom?10:0}}>{PRESETS.map(p=><button key={p.label} onClick={()=>{setPreset(p.label);setIsCustom(false);}} style={{fontSize:12,padding:"4px 12px",background:!isCustom&&preset===p.label?"var(--clr-primary)":"transparent",color:!isCustom&&preset===p.label?"#fff":"#64748B",border:`1.5px solid ${!isCustom&&preset===p.label?"var(--clr-primary)":"#E2E8F0"}`,borderRadius:20}}>{p.label}</button>)}<button onClick={()=>setIsCustom(true)} style={{fontSize:12,padding:"4px 12px",background:isCustom?"var(--clr-primary)":"transparent",color:isCustom?"#fff":"#64748B",border:`1.5px solid ${isCustom?"var(--clr-primary)":"#E2E8F0"}`,borderRadius:20}}>自由設定</button></div>

    {typeStats.length>0&&<Card style={{marginBottom:"1rem"}}><div style={{fontSize:14,fontWeight:700,marginBottom:10,color:"#1E293B"}}>作業種別別集計</div>{typeStats.map((t,i)=>(<div key={t.type} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}><span style={{fontWeight:i===0?700:400,color:"#1E293B"}}>{t.type} <span style={{color:"#64748B",fontWeight:400,fontSize:12}}>{t.qty}件</span></span><span style={{fontWeight:600}}>{yen(t.total)}</span></div><div style={{height:6,background:"#E2E8F0",borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${Math.round((t.total/(typeStats[0]?.total||1))*100)}%`,background:"var(--clr-primary)",borderRadius:3}}/></div></div>))}</Card>}

    {(()=>{const mData={};paid.forEach(j=>{const mo=j.receiveDate?.slice(0,7);if(!mo)return;if(!mData[mo])mData[mo]={month:mo,income:0};mData[mo].income+=totalPrice(j);});const arr=Object.values(mData).sort((a,b)=>a.month.localeCompare(b.month));if(arr.length===0)return null;const maxInc=Math.max(...arr.map(m=>m.income),1);return(<Card><div style={{fontSize:14,fontWeight:700,marginBottom:12,color:"#1E293B"}}>月別収益推移</div><div style={{display:"flex",alignItems:"flex-end",gap:6,height:100}}>{arr.map(m=><div key={m.month} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}><div style={{fontSize:10,color:"#64748B"}}>{yen(m.income)}</div><div style={{width:"100%",background:"var(--clr-primary)",borderRadius:"3px 3px 0 0",height:`${Math.max(3,Math.round((m.income/maxInc)*68))}px`}}/><div style={{fontSize:10,color:"#64748B"}}>{m.month.slice(5)}月</div></div>)}</div></Card>);})()}
  </div>);
}

function InvoiceTab({jobs,clients}){
  const[selCl,setSelCl]=useState("");const[selMo,setSelMo]=useState(thisMonth());const[selJ,setSelJ]=useState([]);const[invNum,setInvNum]=useState(`INV-${Date.now().toString().slice(-6)}`);const[preview,setPreview]=useState(false);const[addonDisp,setAddonDisp]=useState("separate");
  const gc=id=>clients.find(c=>c.id===id);
  const elig=jobs.filter(j=>(!selCl||j.clientId===Number(selCl))&&(!selMo||j.receiveDate?.startsWith(selMo)));
  const invJ=jobs.filter(j=>selJ.includes(j.id));
  const invTotal=invJ.reduce((s,j)=>s+totalPrice(j),0);
  const clName=gc(invJ[0]?.clientId)?.name||"クライアント名";const payM=gc(invJ[0]?.clientId)?.paymentMethod||"銀行振込";
  function copyText(){const lines=[`請求書 ${invNum}`,`発行日: ${toDay()}`,`請求先: ${clName} 御中`,""];invJ.forEach(j=>{lines.push(`■ ${j.title||"案件"}`);(j.breakdown||[]).forEach(r=>lines.push(`  ${r.type} ×${r.qty}  ${yen(r.qty*r.unitPrice)}`));if(addonDisp==="separate")(j.addOns||[]).forEach(a=>lines.push(`  追加料金（${a.reason}）  ${yen(a.amount)}`));lines.push(`  小計: ${yen(totalPrice(j))}`,"");});lines.push(`合計: ${yen(invTotal)}`,`お支払い方法: ${payM}`);navigator.clipboard?.writeText(lines.join("\n")).then(()=>alert("コピーしました"));}
  return(<div>

      {elig.length===0&&<div style={{color:"#64748B",fontSize:13,padding:"8px 0"}}>該当案件がありません</div>}
      {elig.map(j=>{const cl=gc(j.clientId),checked=selJ.includes(j.id);return(<div key={j.id} onClick={()=>setSelJ(p=>p.includes(j.id)?p.filter(x=>x!==j.id):[...p,j.id])} style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",padding:"10px 12px",borderRadius:8,background:checked?"var(--clr-bg)":"transparent",border:`1.5px solid ${checked?"var(--clr-primary)":"#E2E8F0"}`,marginBottom:6,userSelect:"none"}}><div style={{width:18,height:18,borderRadius:4,border:`2px solid ${checked?"var(--clr-primary)":"#CBD5E1"}`,background:checked?"var(--clr-primary)":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{checked&&<span style={{color:"#fff",fontSize:11,fontWeight:700}}>✓</span>}</div><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,color:"#1E293B"}}>{j.title||"（案件名なし）"}</div><div style={{fontSize:12,color:"#64748B",marginTop:2}}>{cl?.name} · {j.receiveDate}</div><div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>{(j.breakdown||[]).map(r=><span key={r.id} style={{fontSize:11,color:"#64748B",background:"var(--clr-bg)",border:"1px solid #E2E8F0",borderRadius:4,padding:"1px 6px"}}>{r.type}×{r.qty} {yen(r.qty*r.unitPrice)}</span>)}</div></div><div style={{fontSize:14,fontWeight:700,color:"#1E293B",flexShrink:0}}>{yen(totalPrice(j))}</div></div>);})}
      <div style={{marginTop:10,display:"flex",gap:8,justifyContent:"space-between",flexWrap:"wrap"}}><button onClick={()=>setSelJ(elig.map(j=>j.id))} style={{fontSize:12}}>すべて選択</button><button onClick={()=>setPreview(true)} disabled={selJ.length===0} style={{background:"var(--clr-primary)",color:"#fff",border:"none",borderRadius:8,padding:"6px 18px",fontWeight:700,fontSize:13,cursor:"pointer",opacity:selJ.length===0?0.45:1}}>請求書を作成（{selJ.length}件）</button></div>
    </Card>
    {preview&&invJ.length>0&&<Card>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}><div style={{fontSize:14,fontWeight:700,color:"#1E293B"}}>プレビュー</div><div style={{display:"flex",gap:6,flexWrap:"wrap"}}><select value={addonDisp} onChange={e=>setAddonDisp(e.target.value)} style={{fontSize:12,padding:"4px 8px",width:"auto"}}><option value="separate">追加料金を別行</option><option value="merged">まとめて表示</option></select><input value={invNum} onChange={e=>setInvNum(e.target.value)} style={{fontSize:12,width:140}}/><button onClick={copyText} style={{fontSize:12,padding:"4px 10px"}}><i className="ti ti-copy"/> コピー</button><button onClick={()=>window.print()} className="no-print" style={{fontSize:12,padding:"4px 10px"}}><i className="ti ti-printer"/> 印刷</button></div></div>
      <div style={{border:"1.5px solid #E2E8F0",borderRadius:10,padding:"1.25rem",background:"#FAFAFA"}}>
        <div style={{fontSize:20,fontWeight:700,marginBottom:4,color:"#1E293B"}}>請求書</div>
        <div style={{fontSize:12,color:"#64748B",marginBottom:16}}>{invNum}　{toDay()}</div>
        <div style={{marginBottom:16,fontSize:14}}><strong>{clName}</strong> 御中</div>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{borderBottom:"1.5px solid #E2E8F0"}}><th style={{textAlign:"left",padding:"6px 0",color:"#64748B",fontWeight:600}}>内容</th><th style={{textAlign:"center",padding:"6px 0",color:"#64748B",fontWeight:600,width:44}}>数量</th><th style={{textAlign:"right",padding:"6px 0",color:"#64748B",fontWeight:600,width:80}}>単価</th><th style={{textAlign:"right",padding:"6px 0",color:"#64748B",fontWeight:600,width:88}}>小計</th></tr></thead>
          <tbody>{invJ.map(j=>[<tr key={`h-${j.id}`}><td colSpan={4} style={{padding:"8px 0 4px",fontWeight:700,color:"#1E293B",fontSize:13,borderTop:"1px solid #F1F5F9"}}>{j.title||"案件"}</td></tr>,...(j.breakdown||[]).map(r=><tr key={r.id}><td style={{padding:"3px 0 3px 12px",color:"#334155"}}>{r.type}{r.note?` (${r.note})`:""}</td><td style={{textAlign:"center",color:"#64748B",padding:"3px 0"}}>{r.qty}</td><td style={{textAlign:"right",color:"#64748B",padding:"3px 0"}}>{yen(r.unitPrice)}</td><td style={{textAlign:"right",fontWeight:500,padding:"3px 0"}}>{yen(r.qty*r.unitPrice)}</td></tr>),...(addonDisp==="separate"?(j.addOns||[]).map(a=><tr key={`a-${a.id}`}><td colSpan={3} style={{padding:"3px 0 3px 12px",color:"#C2410C",fontSize:12}}>追加料金（{a.reason}{a.customReason?": "+a.customReason:""}）</td><td style={{textAlign:"right",color:"#C2410C",padding:"3px 0"}}>{yen(a.amount)}</td></tr>):[]),<tr key={`s-${j.id}`}><td colSpan={3} style={{padding:"3px 0 8px 12px",color:"#64748B",fontSize:11,borderBottom:"1px solid #E2E8F0"}}>小計</td><td style={{textAlign:"right",padding:"3px 0 8px",fontWeight:600,borderBottom:"1px solid #E2E8F0"}}>{yen(totalPrice(j))}</td></tr>])}</tbody>
          <tfoot><tr><td colSpan={3} style={{padding:"10px 0",fontWeight:700,fontSize:15}}>合計</td><td style={{textAlign:"right",fontWeight:700,fontSize:20,color:"#1E293B",padding:"10px 0"}}>{yen(invTotal)}</td></tr></tfoot>
        </table>
        <div style={{marginTop:12,paddingTop:12,borderTop:"1px solid #E2E8F0",fontSize:13,color:"#64748B"}}>お支払い方法: <strong style={{color:"#334155"}}>{payM}</strong></div>
      </div>
    </Card>}
  </div>);
}

function ContractTab({jobs,clients}){
  const[selJob,setSelJob]=useState("");const[form,setForm]=useState({revisions:3,paymentDays:14,deliveryFormat:"MP4, JPG",copyright:"クライアントに譲渡",additionalNotes:"",paymentTiming:"納品後"});const[editTxt,setEditTxt]=useState("");const[generated,setGenerated]=useState(false);
  const gc=id=>clients.find(c=>c.id===id);const job=jobs.find(j=>j.id===Number(selJob));const client=job?gc(job.clientId):null;const tp=job?totalPrice(job):0;
  function generate(){const bdLines=(job?.breakdown||[]).map(r=>`    ${r.type} ×${r.qty}  ${yen(r.qty*r.unitPrice)}`);const text=["業務委託 受注書","",`発行日: ${toDay()}`,`受注番号: ORD-${Date.now().toString().slice(-6)}`,``,`【依頼者】${client?.name||""}`,`【受注者】（あなたの名前・屋号）`,"","─────────────────────────────","■ 業務内容",`  案件名: ${job?.title||""}`,`  納品物: ${form.deliveryFormat}`,`  受注日: ${job?.receiveDate||""}`,`  納品予定日: ${job?.deadline||""}（修正対応完了後の最終納品日）`,"","■ 作業内訳",...bdLines,"","■ 料金",`  内訳合計: ${yen(bdTotal(job?.breakdown))}`,...(job?.addOns?.length?[`  追加料金: ${yen(tp-bdTotal(job?.breakdown))}`]:[]),`  合計（税込）: ${yen(tp)}`,"","■ 修正について",`  本見積もりに含まれる修正回数: ${form.revisions}回まで`,"  上記を超える修正は追加料金が発生します（都度ご相談）。","■ 著作権",`  ${form.copyright}`,"","■ お支払い",`  方法: ${client?.paymentMethod||"銀行振込"}`,`  タイミング: ${form.paymentTiming}`,`  期限: 納品後 ${form.paymentDays}日以内`,...(client?.paymentDelay?["  ※ 過去の入金遅延により、今回は前払いをお願いしております。"]:[]),"","■ 特記事項",form.additionalNotes||"  なし","","─────────────────────────────","上記内容をご確認のうえ、ご同意いただけましたらご返信ください。"].join("\n");setEditTxt(text);setGenerated(true);}
  return(<div>
    <h2 style={{fontSize:18,fontWeight:700,color:"#1E293B",marginBottom:"1rem"}}>受注書・契約書</h2>
    <Card style={{marginBottom:"1rem"}}><div style={{fontSize:14,fontWeight:700,marginBottom:10,color:"#1E293B"}}>案件を選択</div><select value={selJob} onChange={e=>{setSelJob(e.target.value);setGenerated(false);}} style={{width:"100%",marginBottom:12}}><option value="">案件を選んでください</option>{jobs.map(j=><option key={j.id} value={j.id}>{gc(j.clientId)?.name} — {j.title||"（案件名なし）"} ({j.receiveDate})</option>)}</select>
    {job&&<><div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><div><Lbl>修正回数</Lbl><input type="number" value={form.revisions} onChange={e=>setForm(f=>({...f,revisions:e.target.value}))} style={{width:"100%",boxSizing:"border-box"}}/></div><div><Lbl>支払い期限（日数）</Lbl><input type="number" value={form.paymentDays} onChange={e=>setForm(f=>({...f,paymentDays:e.target.value}))} style={{width:"100%",boxSizing:"border-box"}}/></div><div><Lbl>支払いタイミング</Lbl><select value={form.paymentTiming} onChange={e=>setForm(f=>({...f,paymentTiming:e.target.value}))} style={{width:"100%"}}><option>納品後</option><option>前払い</option><option>分割（前払い50%）</option></select></div><div><Lbl>納品形式</Lbl><input value={form.deliveryFormat} onChange={e=>setForm(f=>({...f,deliveryFormat:e.target.value}))} style={{width:"100%",boxSizing:"border-box"}}/></div><div style={{gridColumn:"1/-1"}}><Lbl>著作権</Lbl><select value={form.copyright} onChange={e=>setForm(f=>({...f,copyright:e.target.value}))} style={{width:"100%"}}><option>クライアントに譲渡</option><option>受注者が保持（ライセンス提供）</option><option>別途協議</option></select></div><div style={{gridColumn:"1/-1"}}><Lbl>特記事項</Lbl><textarea value={form.additionalNotes} onChange={e=>setForm(f=>({...f,additionalNotes:e.target.value}))} style={{width:"100%",height:60,boxSizing:"border-box",resize:"vertical"}}/></div></div><div style={{marginTop:10,textAlign:"right"}}><button onClick={generate} style={{background:"var(--clr-primary)",color:"#fff",border:"none",borderRadius:8,padding:"7px 22px",fontWeight:700,cursor:"pointer"}}>受注書を生成</button></div></>}
    </Card>
    {generated&&<Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}}><div style={{fontSize:14,fontWeight:700,color:"#1E293B"}}>受注書（編集可能）</div><div style={{display:"flex",gap:6}}><button onClick={()=>navigator.clipboard?.writeText(editTxt).then(()=>alert("コピーしました"))} style={{fontSize:12,padding:"4px 10px"}}><i className="ti ti-copy"/> コピー</button><button onClick={()=>window.print()} className="no-print" style={{fontSize:12,padding:"4px 10px"}}><i className="ti ti-printer"/> 印刷</button></div></div><textarea value={editTxt} onChange={e=>setEditTxt(e.target.value)} style={{width:"100%",height:420,boxSizing:"border-box",fontFamily:"monospace",fontSize:12,lineHeight:1.8,border:"1.5px solid #E2E8F0",borderRadius:8,padding:"12px",resize:"vertical",color:"#334155",background:"#FAFAFA"}}/></Card>}
  </div>);
}

function SettingsTab({settings,setSettings,clients,setClients,onLogout,userEmail,onFeedback}){
  const[local,setLocal]=useState(settings);const[confirmDel,setConfirmDel]=useState(null);const[editCl,setEditCl]=useState(null);
  function save(){setSettings(local);alert("設定を保存しました");}
  function upJT(id,field,val){setLocal(s=>({...s,jobTypes:s.jobTypes.map(t=>t.id===id?{...t,[field]:field==="name"?val:Number(val)}:t)}));}
  function rmJT(id){setLocal(s=>({...s,jobTypes:s.jobTypes.filter(t=>t.id!==id)}));setConfirmDel(null);}
  const theme=PASTEL_THEMES.find(t=>t.id===local.themeId)||PASTEL_THEMES[0];
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}}><h2 style={{fontSize:18,fontWeight:700,color:"#1E293B"}}>設定</h2><button onClick={save} style={{background:"var(--clr-primary)",color:"#fff",border:"none",borderRadius:8,padding:"6px 22px",fontWeight:700,cursor:"pointer"}}>保存する</button></div>
    <Card style={{marginBottom:"1rem"}}><div style={{fontSize:14,fontWeight:700,color:"#1E293B",marginBottom:10}}>アカウント</div><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}><div><div style={{fontSize:13,color:"#1E293B",fontWeight:600}}>{userEmail}</div><div style={{fontSize:12,color:"#64748B",marginTop:2}}>データはSupabaseクラウドに同期されています</div></div><div style={{display:"flex",gap:8}}><button onClick={onFeedback} style={{fontSize:13,color:"var(--clr-primary)",borderColor:"var(--clr-primary)",background:"transparent",padding:"5px 14px"}}><i className="ti ti-message" style={{marginRight:4}}/>フィードバック</button><button onClick={onLogout} style={{fontSize:13,color:"#EF4444",borderColor:"#FECDD3",background:"#FFF1F2",padding:"5px 14px"}}><i className="ti ti-logout" style={{marginRight:4}}/>ログアウト</button></div></div></Card>
    <Card style={{marginBottom:"1rem"}}><div style={{fontSize:14,fontWeight:700,color:"#1E293B",marginBottom:10}}>テーマ・表示</div><div style={{marginBottom:12}}><Lbl>テーマカラー（{theme.label}）</Lbl><div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:6}}>{PASTEL_THEMES.map(t=><button key={t.id} onClick={()=>setLocal(s=>({...s,themeId:t.id}))} title={t.label} style={{width:36,height:36,borderRadius:"50%",background:t.primary,border:local.themeId===t.id?"3px solid #1E293B":`3px solid ${t.primary}`,cursor:"pointer",position:"relative",padding:0}}>{local.themeId===t.id&&<span style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:16}}>✓</span>}</button>)}</div></div><div><Lbl>フォントサイズ: {local.fontSize}px</Lbl><input type="range" min={12} max={18} step={1} value={local.fontSize} onChange={e=>setLocal(s=>({...s,fontSize:Number(e.target.value)}))} style={{width:"100%"}}/></div></Card>
    <Card style={{marginBottom:"1rem"}}><div style={{fontSize:14,fontWeight:700,color:"#1E293B",marginBottom:10}}>作業ルール</div><div className="grid-2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}><div><Lbl tip={TOOLTIPS.workHours}>1日の作業時間（h）</Lbl><input type="number" value={local.workHoursPerDay} onChange={e=>setLocal(s=>({...s,workHoursPerDay:Number(e.target.value)}))} style={{width:"100%",boxSizing:"border-box"}}/></div><div><Lbl tip={TOOLTIPS.monthlyLimit}>月間案件上限数</Lbl><input type="number" value={local.monthlyJobLimit} onChange={e=>setLocal(s=>({...s,monthlyJobLimit:Number(e.target.value)}))} style={{width:"100%",boxSizing:"border-box"}}/></div><div style={{gridColumn:"1/-1"}}><Lbl tip={TOOLTIPS.alertHourlyRate}>時給アラート: {yen(local.alertHourlyRate)}/h</Lbl><input type="range" min={500} max={5000} step={100} value={local.alertHourlyRate} onChange={e=>setLocal(s=>({...s,alertHourlyRate:Number(e.target.value)}))} style={{width:"100%"}}/><div style={{fontSize:12,color:"#64748B",marginTop:2}}>この時給を下回る案件にアラートが表示されます</div></div></div></Card>
    <Card style={{marginBottom:"1rem"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><div style={{fontSize:14,fontWeight:700,color:"#1E293B",display:"flex",alignItems:"center",gap:4}}><Tooltip text={TOOLTIPS.jobType}>作業種別・料金表</Tooltip></div><button onClick={()=>setLocal(s=>({...s,jobTypes:[...s.jobTypes,{id:Date.now(),name:"新しい種別",hours:2,defaultPrice:5000}]}))} style={{fontSize:12,padding:"4px 10px"}}>+ 追加</button></div><div style={{fontSize:12,color:"#64748B",marginBottom:8}}>種別名 / 工数(h) / 標準価格 / 時給換算</div>{local.jobTypes.map(t=>{const rate=t.hours>0?Math.round(t.defaultPrice/t.hours):0;return(<div key={t.id} style={{display:"grid",gridTemplateColumns:"1fr 60px 100px 72px 36px",gap:6,alignItems:"center",marginBottom:6}}><input value={t.name} onChange={e=>upJT(t.id,"name",e.target.value)} style={{boxSizing:"border-box"}}/><input type="number" value={t.hours} onChange={e=>upJT(t.id,"hours",e.target.value)} style={{boxSizing:"border-box"}} step="0.5"/><input type="number" value={t.defaultPrice} onChange={e=>upJT(t.id,"defaultPrice",e.target.value)} style={{boxSizing:"border-box"}}/><div style={{fontSize:12,color:rate<local.alertHourlyRate?"#C2410C":"#15803D",fontWeight:700,textAlign:"center"}}>{yen(rate)}/h</div><button onClick={()=>setConfirmDel({type:"jobType",id:t.id})} style={{padding:"4px",color:"#fff",background:"#EF4444",border:"1px solid #EF4444",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:13}}><i className="ti ti-trash"/></button></div>);})}</Card>
    <Card style={{marginBottom:"1rem"}}><div style={{fontSize:14,fontWeight:700,color:"#1E293B",marginBottom:10}}>クライアント管理</div>{clients.map(c=>(<div key={c.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",background:"var(--clr-bg)",borderRadius:8,marginBottom:6,border:"1px solid #E2E8F0"}}><div style={{width:10,height:10,borderRadius:"50%",background:c.color,flexShrink:0}}/><span style={{flex:1,fontSize:13,fontWeight:600,color:"#1E293B"}}>{c.name}{c.paymentDelay&&<span style={{marginLeft:6,fontSize:11,color:"#C2410C",background:"#FFF7ED",padding:"1px 6px",borderRadius:10}}>⚠ 遅延歴</span>}</span><span style={{fontSize:12,color:"#64748B"}}>{c.paymentMethod}</span><button onClick={()=>setEditCl({...c})} style={{fontSize:12,padding:"3px 8px",borderRadius:6}}><i className="ti ti-edit"/></button><button onClick={()=>setConfirmDel({type:"client",id:c.id})} style={{padding:"3px 7px",fontSize:13,color:"#fff",background:"#EF4444",border:"1px solid #EF4444",borderRadius:6,cursor:"pointer"}}><i className="ti ti-trash"/></button></div>))}</Card>
    {confirmDel&&<Confirm message={confirmDel.type==="jobType"?"この種別を削除しますか？":"このクライアントを削除しますか？"} onConfirm={()=>{if(confirmDel.type==="jobType")rmJT(confirmDel.id);else{setClients(p=>p.filter(c=>c.id!==confirmDel.id));setConfirmDel(null);}}} onCancel={()=>setConfirmDel(null)}/>}
    {editCl&&<Modal title="クライアント編集" onClose={()=>setEditCl(null)}><div style={{display:"flex",flexDirection:"column",gap:10}}><div><Lbl>クライアント名</Lbl><input value={editCl.name} onChange={e=>setEditCl(c=>({...c,name:e.target.value}))} style={{width:"100%",boxSizing:"border-box"}}/></div><div><Lbl>支払い方法</Lbl><select value={editCl.paymentMethod} onChange={e=>setEditCl(c=>({...c,paymentMethod:e.target.value}))} style={{width:"100%"}}>{PAYMENT_METHODS.map(m=><option key={m}>{m}</option>)}</select></div><div style={{display:"flex",alignItems:"center",gap:8}}><input type="checkbox" id="delay" checked={editCl.paymentDelay} onChange={e=>setEditCl(c=>({...c,paymentDelay:e.target.checked}))} style={{accentColor:"#EF4444",width:15,height:15,flexShrink:0,cursor:"pointer"}}/><label htmlFor="delay" style={{fontSize:13,color:"#1E293B",cursor:"pointer"}}><Tooltip text={TOOLTIPS.paymentDelay}>入金遅延歴あり（前払い推奨）</Tooltip></label></div><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{CLIENT_PALETTE.map(col=><button key={col} onClick={()=>setEditCl(c=>({...c,color:col}))} style={{width:28,height:28,borderRadius:"50%",background:col,border:editCl.color===col?"3px solid #1E293B":`3px solid ${col}`,cursor:"pointer",padding:0}}/>)}</div><div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><button onClick={()=>setEditCl(null)}>キャンセル</button><button onClick={()=>{setClients(p=>p.map(c=>c.id===editCl.id?editCl:c));setEditCl(null);}} style={{background:"var(--clr-primary)",color:"#fff",border:"none",borderRadius:8,padding:"6px 18px",fontWeight:700,cursor:"pointer"}}>保存</button></div></div></Modal>}
  </div>);
}

function FeedbackModal({userEmail,onClose}){
  const[text,setText]=useState("");const[cat,setCat]=useState("機能要望");const[sent,setSent]=useState(false);const[loading,setLoading]=useState(false);
  const CATS=["機能要望","バグ報告","使いにくい点","その他"];
  async function send(){if(!text.trim())return;setLoading(true);try{await sb.from("feedback").insert({user_email:userEmail,category:cat,message:text,created_at:new Date().toISOString()});setSent(true);}catch(e){const fb=JSON.parse(localStorage.getItem("fk_feedback")||"[]");fb.push({email:userEmail,cat,text,date:new Date().toISOString()});localStorage.setItem("fk_feedback",JSON.stringify(fb));setSent(true);}setLoading(false);}
  return(<Modal title="フィードバック" onClose={onClose}>{sent?(<div style={{textAlign:"center",padding:"2rem 0"}}><i className="ti ti-check-circle" style={{fontSize:48,color:"#10B981",display:"block",marginBottom:12}}/><div style={{fontSize:15,fontWeight:700,color:"#1E293B",marginBottom:8}}>ありがとうございます！</div><div style={{fontSize:13,color:"#64748B"}}>フィードバックを受け取りました。今後の改善に活用します。</div><button onClick={onClose} style={{marginTop:20,padding:"7px 24px"}}>閉じる</button></div>):(<div style={{display:"flex",flexDirection:"column",gap:12}}><div style={{fontSize:13,color:"#64748B",lineHeight:1.6}}>機能要望・バグ・使いにくい点など、なんでもお気軽にどうぞ。いただいたフィードバックは今後の改善に活用します。</div><div><Lbl>カテゴリ</Lbl><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{CATS.map(c=><button key={c} onClick={()=>setCat(c)} style={{fontSize:12,padding:"4px 12px",background:cat===c?"var(--clr-primary)":"transparent",color:cat===c?"#fff":"#64748B",border:`1.5px solid ${cat===c?"var(--clr-primary)":"#E2E8F0"}`,borderRadius:20}}>{c}</button>)}</div></div><div><Lbl>内容</Lbl><textarea value={text} onChange={e=>setText(e.target.value)} placeholder="例：サムネイルの一括登録ができると助かります" style={{width:"100%",height:120,boxSizing:"border-box",resize:"vertical"}}/></div><div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><button onClick={onClose}>キャンセル</button><button onClick={send} disabled={!text.trim()||loading} style={{background:"var(--clr-primary)",color:"#fff",border:"none",borderRadius:8,padding:"7px 22px",fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>{loading&&<i className="ti ti-refresh" style={{animation:"spin 1s linear infinite"}}/>}送信</button></div></div>)}</Modal>);
}

function App(){
  const[user,setUser]=useState(null);const[authLoading,setAuthLoading]=useState(true);const[appLoading,setAppLoading]=useState(false);
  const[activeTab,setActiveTab]=useState("home");const[jobs,setJobsRaw]=useState([]);const[clients,setClientsRaw]=useState([]);const[expenses,setExpensesRaw]=useState([]);const[settings,setSettingsRaw]=useState(INIT_SETTINGS);
  const[syncing,setSyncing]=useState(false);const[lastSync,setLastSync]=useState(null);const[menuOpen,setMenuOpen]=useState(false);const[showSampleBanner,setShowSampleBanner]=useState(false);const[showFeedback,setShowFeedback]=useState(false);
  const syncTimer=useRef(null);
  useEffect(()=>{sb.auth.getSession().then(({data:{session}})=>{setUser(session?.user||null);setAuthLoading(false);});const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>setUser(session?.user||null));return()=>subscription.unsubscribe();},[]);
  useEffect(()=>{if(!user)return;async function load(){setAppLoading(true);const uid=user.id;try{const[j,c,e,s]=await Promise.all([dbLoad("jobs",uid),dbLoad("clients",uid),dbLoad("expenses",uid),dbLoad("settings",uid)]);const isNew=!j&&!c&&!e&&!s;setJobsRaw(j||SAMPLE_JOBS);setClientsRaw(c||SAMPLE_CLIENTS);setExpensesRaw(e||SAMPLE_EXPENSES);if(s)setSettingsRaw(s);if(isNew)setShowSampleBanner(true);}catch(err){console.error(err);}setAppLoading(false);}load();},[user]);
  function scheduleSave(table,data){if(!user)return;setSyncing(true);if(syncTimer.current)clearTimeout(syncTimer.current);syncTimer.current=setTimeout(async()=>{try{await dbSave(table,user.id,data);setLastSync(new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})+"保存");}catch(err){console.error(err);}setSyncing(false);},1200);}
  function setJobs(v){const n=typeof v==="function"?v(jobs):v;setJobsRaw(n);scheduleSave("jobs",n);}
  function setClients(v){const n=typeof v==="function"?v(clients):v;setClientsRaw(n);scheduleSave("clients",n);}
  function setExpenses(v){const n=typeof v==="function"?v(expenses):v;setExpensesRaw(n);scheduleSave("expenses",n);}
  function setSettings(v){const n=typeof v==="function"?v(settings):v;setSettingsRaw(n);scheduleSave("settings",n);}
  async function handleLogout(){await sb.auth.signOut();setJobsRaw([]);setClientsRaw([]);setExpensesRaw([]);setSettingsRaw(INIT_SETTINGS);setLastSync(null);setActiveTab("home");}
  const theme=PASTEL_THEMES.find(t=>t.id===settings.themeId)||PASTEL_THEMES[0];
  useEffect(()=>{const r=document.documentElement;r.style.setProperty("--clr-primary",theme.primary);r.style.setProperty("--clr-bg",theme.bg);r.style.setProperty("--clr-card",theme.card);document.body.style.background=theme.bg;document.body.style.fontSize=settings.fontSize+"px";},[theme,settings.fontSize]);
  if(authLoading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh"}}><i className="ti ti-refresh" style={{fontSize:32,color:"#6366F1",animation:"spin 1s linear infinite"}}/></div>;
  if(!user)return<LoginScreen onLogin={u=>setUser(u)}/>;
  if(appLoading)return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:16,background:theme.bg}}><div style={{width:44,height:44,borderRadius:12,background:theme.primary,display:"flex",alignItems:"center",justifyContent:"center"}}><i className="ti ti-briefcase" style={{color:"#fff",fontSize:24}}/></div><div style={{fontSize:18,fontWeight:700,color:theme.primary}}>FreelanceKit</div><div style={{fontSize:13,color:"#94A3B8"}}>データを読み込んでいます...</div></div>);
  const tabContent={home:<HomeTab jobs={jobs} clients={clients} settings={settings} expenses={expenses}/>,jobs:<JobsTab jobs={jobs} setJobs={setJobs} clients={clients} setClients={setClients} settings={settings}/>,calendar:<CalendarTab jobs={jobs} clients={clients} settings={settings}/>,finance:<FinanceTab jobs={jobs} expenses={expenses} setExpenses={setExpenses} settings={settings} setSettings={setSettings}/>,analysis:<AnalysisTab jobs={jobs} clients={clients} expenses={expenses} settings={settings}/>,invoice:<InvoiceTab jobs={jobs} clients={clients}/>,contract:<ContractTab jobs={jobs} clients={clients}/>,settings:<SettingsTab settings={settings} setSettings={setSettings} clients={clients} setClients={setClients} onLogout={handleLogout} userEmail={user.email} onFeedback={()=>setShowFeedback(true)}/>};
  return(<div style={{maxWidth:820,margin:"0 auto",padding:"0.75rem",minHeight:"100vh"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"0.75rem",padding:"0.75rem 1rem",background:theme.card,borderRadius:12,border:"1.5px solid #E2E8F0",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}><div style={{width:32,height:32,borderRadius:8,background:theme.primary,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><i className="ti ti-briefcase" style={{color:"#fff",fontSize:18}}/></div><div style={{flex:1}}><div style={{fontSize:16,fontWeight:900,color:theme.primary}}>FreelanceKit</div><div style={{fontSize:11,color:"#94A3B8"}}>{user.email}</div></div><div style={{display:"flex",alignItems:"center",gap:8}}><button onClick={()=>setShowFeedback(true)} style={{fontSize:11,padding:"3px 10px",color:"var(--clr-primary)",borderColor:"var(--clr-primary)",background:"transparent"}} className="no-print"><i className="ti ti-message"/> フィードバック</button><div style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:"#94A3B8"}}>{syncing?<><i className="ti ti-refresh" style={{fontSize:13,animation:"spin 1s linear infinite"}}/> 同期中...</>:lastSync?<><i className="ti ti-cloud-check" style={{fontSize:13,color:"#34D399"}}/> {lastSync}</>:null}</div></div></div>
    <div style={{display:"flex",gap:2,overflowX:"auto",marginBottom:"1rem",background:theme.card,borderRadius:12,border:"1.5px solid #E2E8F0",padding:"4px"}}>{TABS.map(tab=>{const active=activeTab===tab.id;return(<button key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{padding:"7px 10px",fontSize:12,border:"none",borderRadius:8,background:active?theme.primary:"transparent",color:active?"#fff":"#64748B",fontWeight:active?700:400,cursor:"pointer",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:4,flex:"0 0 auto"}}><i className={`ti ${tab.icon}`} style={{fontSize:14}}/>{tab.label}</button>);})}</div>
    <div style={{paddingBottom:80}}>{showSampleBanner&&<SampleBanner onDismiss={()=>setShowSampleBanner(false)}/>}{tabContent[activeTab]}</div>
    <div style={{position:"fixed",bottom:0,left:0,right:0,background:theme.card,borderTop:"1.5px solid #E2E8F0",zIndex:100,padding:"4px 0",display:"none"}} id="mobile-nav"><div style={{display:"flex",justifyContent:"space-around",maxWidth:820,margin:"0 auto"}}>{TABS.slice(0,5).map(tab=>{const active=activeTab===tab.id;return(<button key={tab.id} onClick={()=>setActiveTab(tab.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 4px",border:"none",background:"transparent",color:active?theme.primary:"#94A3B8",cursor:"pointer",fontSize:10,fontWeight:active?700:400,minWidth:52}}><i className={`ti ${tab.icon}`} style={{fontSize:20}}/><span>{tab.label}</span></button>);})} <button onClick={()=>setMenuOpen(m=>!m)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 4px",border:"none",background:"transparent",color:["invoice","contract","settings"].includes(activeTab)?theme.primary:"#94A3B8",cursor:"pointer",fontSize:10,minWidth:52}}><i className="ti ti-dots" style={{fontSize:20}}/><span>その他</span></button></div></div>
    {menuOpen&&<div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(0,0,0,0.4)"}} onClick={()=>setMenuOpen(false)}><div style={{position:"absolute",bottom:70,left:16,right:16,background:theme.card,borderRadius:16,border:"1.5px solid #E2E8F0",padding:"8px",boxShadow:"0 -8px 32px rgba(0,0,0,0.15)"}} onClick={e=>e.stopPropagation()}>{TABS.slice(5).map(tab=>{const active=activeTab===tab.id;return(<button key={tab.id} onClick={()=>{setActiveTab(tab.id);setMenuOpen(false);}} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",border:"none",borderRadius:10,background:active?theme.primary+"22":"transparent",color:active?theme.primary:"#334155",cursor:"pointer",width:"100%",fontSize:14,fontWeight:active?700:400}}><i className={`ti ${tab.icon}`} style={{fontSize:20}}/>{tab.label}</button>);})}</div></div>}
    {showFeedback&&<FeedbackModal userEmail={user.email} onClose={()=>setShowFeedback(false)}/>}
    <style>{`@media(max-width:600px){#mobile-nav{display:block!important}}`}</style>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
